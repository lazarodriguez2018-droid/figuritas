<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Figuritas 2026">
<meta name="theme-color" content="#0f1923">
<title>Figuritas Mundial 2026</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#0f1923;--card:#1a2535;--border:#263548;
  --gold:#f5c518;--green:#27ae60;--red:#e74c3c;--blue:#3498db;
  --text:#ecf0f1;--muted:#7f8c9a;
}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);height:100vh;height:-webkit-fill-available;display:flex;flex-direction:column;overflow:hidden;}

/* TOP BAR */
.topbar{background:#111e2d;border-bottom:1px solid var(--border);padding:12px 14px 10px;padding-top:max(12px,env(safe-area-inset-top));flex-shrink:0;}
.topbar-row1{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.logo{font-size:18px;font-weight:900;color:var(--gold);flex:1;letter-spacing:0.5px;}
.logo small{display:block;font-size:10px;color:var(--muted);font-weight:600;letter-spacing:2px;}
.counters{display:flex;gap:6px;}
.cnt{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:5px 10px;text-align:center;min-width:54px;}
.cnt .n{font-size:20px;font-weight:900;line-height:1;}
.cnt .l{font-size:9px;color:var(--muted);font-weight:700;letter-spacing:1px;}
.cnt.miss .n{color:var(--red);}
.cnt.have .n{color:var(--green);}
.cnt.pct .n{color:var(--gold);}

/* SEARCH */
.search-wrap{position:relative;}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:16px;pointer-events:none;}
.search-box{width:100%;background:var(--card);border:2px solid var(--border);border-radius:12px;padding:10px 40px 10px 38px;color:var(--text);font-size:16px;outline:none;transition:border-color 0.2s;}
.search-box:focus{border-color:var(--gold);}
.search-clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:var(--border);border:none;color:var(--muted);width:24px;height:24px;border-radius:12px;font-size:14px;cursor:pointer;display:none;align-items:center;justify-content:center;}
.search-clear.vis{display:flex;}

/* TABS */
.tabs{display:flex;background:#111e2d;border-bottom:1px solid var(--border);flex-shrink:0;}
.tab{flex:1;padding:10px 4px;font-size:11px;font-weight:800;letter-spacing:0.5px;color:var(--muted);text-align:center;cursor:pointer;border-bottom:3px solid transparent;transition:all 0.2s;}
.tab.active{color:var(--gold);border-bottom-color:var(--gold);}

/* SCROLL AREA */
.scroll-area{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 12px 20px;padding-bottom:max(20px,env(safe-area-inset-bottom));}

/* GROUP HEADER */
.grp-hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 2px 6px;cursor:pointer;user-select:none;}
.grp-hdr:first-child{padding-top:4px;}
.grp-title{font-size:13px;font-weight:900;color:var(--muted);letter-spacing:2px;text-transform:uppercase;}
.grp-badge{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:3px 10px;font-size:12px;font-weight:800;color:var(--red);}
.grp-badge.done{color:var(--green);border-color:var(--green);}

/* TEAM ROW */
.team-section{margin-bottom:8px;}
.team-row{display:flex;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px;gap:10px;cursor:pointer;user-select:none;transition:background 0.15s;}
.team-row:active{background:#202f45;}
.team-flag{font-size:24px;flex-shrink:0;}
.team-info{flex:1;min-width:0;}
.team-name{font-size:15px;font-weight:800;}
.team-sub{font-size:11px;color:var(--muted);margin-top:1px;}
.team-right{text-align:right;flex-shrink:0;}
.team-count{font-size:18px;font-weight:900;color:var(--gold);line-height:1;}
.team-bar{width:50px;height:4px;background:var(--border);border-radius:2px;margin-top:4px;overflow:hidden;}
.team-bar-fill{height:100%;background:var(--gold);border-radius:2px;transition:width 0.3s;}
.team-bar-fill.done{background:var(--green);}

/* STICKER LIST (bajo cada equipo) */
.stk-list{display:none;flex-direction:column;gap:0;margin-top:4px;background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.stk-list.open{display:flex;}
.stk-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background 0.1s;user-select:none;}
.stk-item:last-child{border-bottom:none;}
.stk-item:active{background:#202f45;}
.stk-check{width:28px;height:28px;border-radius:8px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;transition:all 0.15s;}
.stk-item.owned .stk-check{background:var(--green);border-color:var(--green);}
.stk-item.shiny .stk-check{border-color:rgba(245,197,24,0.5);}
.stk-item.owned.shiny .stk-check{background:var(--gold);border-color:var(--gold);}
.stk-code{font-size:15px;font-weight:800;width:52px;flex-shrink:0;color:var(--muted);}
.stk-item.owned .stk-code{color:var(--green);}
.stk-item.owned.shiny .stk-code{color:var(--gold);}
.stk-lbl{font-size:14px;flex:1;color:var(--text);}
.stk-lbl.shiny-lbl{color:var(--gold);}
.stk-shine{font-size:12px;color:var(--gold);font-weight:700;margin-left:auto;flex-shrink:0;}

/* MISSING LIST */
.miss-team{margin-bottom:14px;}
.miss-team-hdr{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.miss-team-flag{font-size:20px;}
.miss-team-name{font-size:14px;font-weight:800;}
.miss-team-count{font-size:12px;color:var(--red);font-weight:700;margin-left:auto;}
.chips{display:flex;flex-wrap:wrap;gap:5px;}
.chip{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:800;color:var(--red);cursor:pointer;transition:all 0.15s;}
.chip:active{transform:scale(0.92);}
.chip.shiny{color:var(--gold);border-color:rgba(245,197,24,0.4);}
.chip.owned{background:rgba(39,174,96,0.15);border-color:var(--green);color:var(--green);}

/* EMPTY STATE */
.empty{text-align:center;padding:40px 20px;color:var(--muted);}
.empty .ei{font-size:48px;margin-bottom:12px;}
.empty .et{font-size:16px;font-weight:700;color:var(--text);}
.empty .es{font-size:13px;margin-top:6px;}

/* TOAST */
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);background:#1e2f45;border:1px solid var(--border);border-radius:20px;padding:9px 20px;font-size:14px;font-weight:700;z-index:999;opacity:0;transition:all 0.25s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.g{border-color:var(--green);color:var(--green);}
.toast.r{border-color:var(--red);color:var(--red);}

.no-results{text-align:center;padding:30px;color:var(--muted);font-size:14px;}
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="topbar-row1">
    <div class="logo"><small>PANINI</small>Mundial 2026 🏆</div>
    <div class="counters">
      <div class="cnt have"><div class="n" id="c-have">0</div><div class="l">TENGO</div></div>
      <div class="cnt miss"><div class="n" id="c-miss">0</div><div class="l">FALTAN</div></div>
      <div class="cnt pct"><div class="n" id="c-pct">0%</div><div class="l">LISTO</div></div>
    </div>
  </div>
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input class="search-box" id="srch" type="search" placeholder="Buscar: ARG, Uruguay, MEX3..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" oninput="onSearch()">
    <button class="search-clear" id="srch-clear" onclick="clearSearch()">✕</button>
  </div>
</div>

<!-- TABS -->
<div class="tabs">
  <div class="tab active" id="tab-faltan" onclick="selTab('faltan')">❌ ME FALTAN</div>
  <div class="tab" id="tab-album" onclick="selTab('album')">📖 ÁLBUM</div>
  <div class="tab" id="tab-tengo" onclick="selTab('tengo')">✅ TENGO</div>
</div>

<!-- CONTENT -->
<div class="scroll-area" id="main-area"></div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

for(var _i=1;_i<=12;_i++) CC.push({id:'CC'+_i,lbl:'Jugador Coca-Cola '+_i,ic:'⭐',sh:true});

var GROUPS = [

  {id:'F',label:'Grupo F',teams:[

    {code:'SWE',name:'Suecia',flag:'🇸🇪'},
    {code:'TUN',name:'Túnez',flag:'🇹🇳'}
  ]},
  {id:'G',label:'Grupo G',teams:[
    {code:'BEL',name:'Bélgica',flag:'🇧🇪'},
    {code:'EGY',name:'Egipto',flag:'🇪🇬'},
    {code:'IRN',name:'Irán',flag:'🇮🇷'},
    {code:'NZL',name:'Nueva Zelanda',flag:'🇳🇿'}
  ]},
  {id:'H',label:'Grupo H',teams:[
    {code:'ESP',name:'España',flag:'🇪🇸'},
    {code:'CPV',name:'Cabo Verde',flag:'🇨🇻'},
    {code:'KSA',name:'Arabia Saudita',flag:'🇸🇦'},
    {code:'URU',name:'Uruguay',flag:'🇺🇾'}
  ]},
  {id:'I',label:'Grupo I',teams:[
    {code:'FRA',name:'Francia',flag:'🇫🇷'},

  ]},
  {id:'J',label:'Grupo J',teams:[

  ]},
  {id:'K',label:'Grupo K',teams:[
    {code:'POR',name:'Portugal',flag:'🇵🇹'},
    {code:'COD',name:'RD Congo',flag:'🇨🇩'},
    {code:'UZB',name:'Uzbekistán',flag:'🇺🇿'},
    {code:'COL',name:'Colombia',flag:'🇨🇴'}
  ]},
  {id:'L',label:'Grupo L',teams:[
    {code:'ENG',name:'Inglaterra',flag:'🏴'},
    {code:'CRO',name:'Croacia',flag:'🇭🇷'},
    {code:'GHA',name:'Ghana',flag:'🇬🇭'},
    {code:'PAN',name:'Panamá',flag:'🇵🇦'}
  ]}
];

// ============================================================
// STATE
// ============================================================
var owned = {};
var curTab = 'faltan';
var srchQ = '';
var openTeams = {};
var toastTmr;

function load() {
  try { var s = localStorage.getItem('fig2026v3'); if(s) owned = JSON.parse(s); } catch(e){}
}
function save() {
  try { localStorage.setItem('fig2026v3', JSON.stringify(owned)); } catch(e){}
}

// ============================================================
// STICKERS POR EQUIPO
// ============================================================
function teamStickers(t) {
  var arr = [
    {id:t.code+'1',lbl:'Escudo Oficial',ic:'🛡️',sh:true},
    {id:t.code+'2',lbl:'Foto de Equipo',ic:'📸',sh:false}
  ];
  for(var i=3;i<=20;i++) arr.push({id:t.code+i,lbl:'Jugador '+(i-2),ic:'⚽',sh:false});
  return arr;
}

// ============================================================
// TODOS LOS STICKERS
// ============================================================
function allGroups() {
  var groups = [];
  groups.push({id:'INICIAL',label:'Sección Inicial',teams:[{code:'',name:'Especiales',flag:'',_stickers:INIT}]});
  groups.push({id:'ESTADIOS',label:'Estadios y Sedes',teams:[{code:'',name:'Estadios',flag:'',_stickers:STAD}]});
  for(var i=0;i<GROUPS.length;i++) groups.push(GROUPS[i]);
  groups.push({id:'CC',label:'Team Coca-Cola',teams:[{code:'',name:'Coca-Cola',flag:'⭐',_stickers:CC}]});
  return groups;
}

function getStickers(team) {
  if(team._stickers) return team._stickers;
  return teamStickers(team);
}

function allStickers() {
  var all = [];
  var groups = allGroups();
  for(var i=0;i<groups.length;i++) {
    var g = groups[i];
    for(var j=0;j<g.teams.length;j++) {
      var stks = getStickers(g.teams[j]);
      for(var k=0;k<stks.length;k++) all.push(stks[k]);
    }
  }
  return all;
}

// ============================================================
// TOGGLE
// ============================================================
function tap(id) {
  if(owned[id]) {
    delete owned[id];
    showToast('Quitada: '+id,'r');
  } else {
    owned[id] = 1;
    showToast('✓ Tengo: '+id,'g');
  }
  save();
  updCounters();
  // actualizar solo el elemento tocado sin re-render total
  updStickerEl(id);
  updTeamBadge(id);
  if(curTab === 'faltan' || curTab === 'tengo') render();
}

function updStickerEl(id) {
  // actualiza chips y stk-items que estén visibles
  var chips = document.querySelectorAll('[data-id="'+id+'"]');
  for(var i=0;i<chips.length;i++) {
    var el = chips[i];
    if(el.classList.contains('chip')) {
      if(owned[id]) el.classList.add('owned');
      else el.classList.remove('owned');
    } else if(el.classList.contains('stk-item')) {
      if(owned[id]) el.classList.add('owned');
      else el.classList.remove('owned');
      var chk = el.querySelector('.stk-check');
      if(chk) chk.textContent = owned[id] ? '✓' : '';
      var code = el.querySelector('.stk-code');
      // color handled by CSS
    }
  }
}

function updTeamBadge(id) {
  // buscar qué equipo es esta figurita y actualizar su badge
  var groups = allGroups();
  for(var i=0;i<groups.length;i++) {
    var g = groups[i];
    for(var j=0;j<g.teams.length;j++) {
      var t = g.teams[j];
      var stks = getStickers(t);
      var found = false;
      for(var k=0;k<stks.length;k++) { if(stks[k].id===id){found=true;break;} }
      if(found) {
        var tkey = g.id+'_'+(t.code||t.name);
        var badge = document.getElementById('badge-'+tkey);
        var bar = document.getElementById('bar-'+tkey);
        var cnt = document.getElementById('cnt-'+tkey);
        if(badge||bar||cnt) {
          var have=0;
          for(var s=0;s<stks.length;s++){if(owned[stks[s].id])have++;}
          var miss=stks.length-have;
          var pct=Math.round(have/stks.length*100);
          if(badge){badge.textContent=miss===0?'✓ Completo':miss+' faltan';badge.className='grp-badge'+(miss===0?' done':'');}
          if(bar){bar.style.width=pct+'%';bar.className='team-bar-fill'+(pct===100?' done':'');}
          if(cnt){cnt.textContent=have+'/'+stks.length;}
        }
        return;
      }
    }
  }
}

// ============================================================
// COUNTERS
// ============================================================
function updCounters() {
  var all = allStickers();
  var total = all.length;
  var have = 0;
  for(var i=0;i<all.length;i++){if(owned[all[i].id])have++;}
  var miss = total-have;
  document.getElementById('c-have').textContent = have;
  document.getElementById('c-miss').textContent = miss;
  document.getElementById('c-pct').textContent = Math.round(have/total*100)+'%';
}

// ============================================================
// SEARCH
// ============================================================
function onSearch() {
  srchQ = document.getElementById('srch').value.toLowerCase().trim();
  var cl = document.getElementById('srch-clear');
  if(srchQ) cl.className='search-clear vis'; else cl.className='search-clear';
  render();
}
function clearSearch() {
  document.getElementById('srch').value='';
  srchQ='';
  document.getElementById('srch-clear').className='search-clear';
  render();
}

// ============================================================
// TABS
// ============================================================
function selTab(t) {
  curTab = t;
  document.getElementById('tab-faltan').className='tab'+(t==='faltan'?' active':'');
  document.getElementById('tab-album').className='tab'+(t==='album'?' active':'');
  document.getElementById('tab-tengo').className='tab'+(t==='tengo'?' active':'');
  render();
}

// ============================================================
// RENDER
// ============================================================
function render() {
  var area = document.getElementById('main-area');
  if(curTab==='album') area.innerHTML = renderAlbum();
  else if(curTab==='faltan') area.innerHTML = renderFiltered(false);
  else area.innerHTML = renderFiltered(true);
}

// ---------- ÁLBUM ----------
function renderAlbum() {
  var groups = allGroups();
  var html = '';
  for(var i=0;i<groups.length;i++) {
    var g = groups[i];
    var gHave=0,gTotal=0;
    for(var j=0;j<g.teams.length;j++){
      var stks=getStickers(g.teams[j]);
      gTotal+=stks.length;
      for(var k=0;k<stks.length;k++){if(owned[stks[k].id])gHave++;}
    }
    var gMiss=gTotal-gHave;

    // filtro de búsqueda: si hay query, verificar si alguna figurita coincide
    if(srchQ) {
      var anyMatch=false;
      for(var j2=0;j2<g.teams.length;j2++){
        var t2=g.teams[j2];
        if(t2.name.toLowerCase().indexOf(srchQ)>=0||(t2.code&&t2.code.toLowerCase().indexOf(srchQ)>=0)){anyMatch=true;break;}
        var stks2=getStickers(t2);
        for(var k2=0;k2<stks2.length;k2++){
          if(stks2[k2].id.toLowerCase().indexOf(srchQ)>=0||stks2[k2].lbl.toLowerCase().indexOf(srchQ)>=0){anyMatch=true;break;}
        }
        if(anyMatch)break;
      }
      if(!anyMatch)continue;
    }

    html+='<div class="grp-hdr" onclick="togGroup(\''+g.id+'\')">';
    html+='<span class="grp-title">'+g.label+'</span>';
    html+='<span class="grp-badge'+(gMiss===0?' done':'')+'" id="gbadge-'+g.id+'">'+(gMiss===0?'✓ Completo':gMiss+' faltan')+'</span>';
    html+='</div>';

    for(var j3=0;j3<g.teams.length;j3++){
      var t3=g.teams[j3];
      html+=renderTeamBlock(g.id,t3,srchQ);
    }
  }
  if(!html) html='<div class="no-results">Sin resultados para "'+srchQ+'"</div>';
  return html;
}

function renderTeamBlock(gid,team,q) {
  var stks = getStickers(team);
  var have=0;
  for(var i=0;i<stks.length;i++){if(owned[stks[i].id])have++;}
  var miss=stks.length-have;
  var pct=Math.round(have/stks.length*100);
  var tkey=gid+'_'+(team.code||team.name);
  var isOpen=openTeams[tkey]||false;

  // si hay búsqueda, forzar abierto si coincide
  if(q){
    var match=team.name.toLowerCase().indexOf(q)>=0||(team.code&&team.code.toLowerCase().indexOf(q)>=0);
    if(!match){
      var hasStk=false;
      for(var i2=0;i2<stks.length;i2++){if(stks[i2].id.toLowerCase().indexOf(q)>=0||stks[i2].lbl.toLowerCase().indexOf(q)>=0){hasStk=true;break;}}
      if(!hasStk)return '';
    }
    isOpen=true;
  }

  var h='<div class="team-section">';
  h+='<div class="team-row" onclick="togTeam(\''+tkey+'\')">';
  if(team.flag) h+='<div class="team-flag">'+team.flag+'</div>';
  h+='<div class="team-info"><div class="team-name">'+team.name+'</div>';
  h+='<div class="team-sub">'+(team.code?team.code+' · ':'')+(miss===0?'Completo':miss+' figuritas faltan')+'</div></div>';
  h+='<div class="team-right"><div class="team-count" id="cnt-'+tkey+'">'+have+'/'+stks.length+'</div>';
  h+='<div class="team-bar"><div class="team-bar-fill'+(pct===100?' done':'')+'" id="bar-'+tkey+'" style="width:'+pct+'%"></div></div></div>';
  h+='</div>';

  h+='<div class="stk-list'+(isOpen?' open':'')+'" id="sl-'+tkey+'">';
  for(var k=0;k<stks.length;k++){
    var s=stks[k];
    // filtro búsqueda en stickers individuales
    if(q && s.id.toLowerCase().indexOf(q)<0 && s.lbl.toLowerCase().indexOf(q)<0 &&
       team.name.toLowerCase().indexOf(q)<0 && !(team.code&&team.code.toLowerCase().indexOf(q)>=0)) continue;
    var isCls='stk-item'+(s.sh?' shiny':'')+(owned[s.id]?' owned':'');
    h+='<div class="'+isCls+'" data-id="'+s.id+'" onclick="tap(\''+s.id+'\')">';
    h+='<div class="stk-check">'+(owned[s.id]?'✓':'')+'</div>';
    h+='<div class="stk-code">'+s.id+'</div>';
    h+='<div class="stk-lbl'+(s.sh?' shiny-lbl':'')+'">'+(s.sh?'⭐ ':'')+s.lbl+'</div>';
    h+='</div>';
  }
  h+='</div></div>';
  return h;
}

function togGroup(gid) {
  // colapsar/expandir todos los equipos del grupo
  var groups=allGroups();
  var g=null;
  for(var i=0;i<groups.length;i++){if(groups[i].id===gid){g=groups[i];break;}}
  if(!g)return;
  var tkey0=gid+'_'+(g.teams[0].code||g.teams[0].name);
  var shouldOpen=!openTeams[tkey0];
  for(var j=0;j<g.teams.length;j++){
    var tk=gid+'_'+(g.teams[j].code||g.teams[j].name);
    openTeams[tk]=shouldOpen;
  }
  render();
}

function togTeam(tkey) {
  openTeams[tkey]=!openTeams[tkey];
  var el=document.getElementById('sl-'+tkey);
  if(el) el.className='stk-list'+(openTeams[tkey]?' open':'');
}

// ---------- FALTAN / TENGO ----------
function renderFiltered(showOwned) {
  var groups=allGroups();
  var html='';
  var total=0;

  for(var i=0;i<groups.length;i++){
    var g=groups[i];
    var ghtml='';
    for(var j=0;j<g.teams.length;j++){
      var team=g.teams[j];
      var stks=getStickers(team);
      var chips='';
      for(var k=0;k<stks.length;k++){
        var s=stks[k];
        var isOwn=!!owned[s.id];
        var show=showOwned?isOwn:!isOwn;
        if(!show)continue;
        if(srchQ&&s.id.toLowerCase().indexOf(srchQ)<0&&s.lbl.toLowerCase().indexOf(srchQ)<0&&team.name.toLowerCase().indexOf(srchQ)<0&&!(team.code&&team.code.toLowerCase().indexOf(srchQ)>=0))continue;
        chips+='<div class="chip'+(s.sh?' shiny':'')+(isOwn?' owned':'')+'" data-id="'+s.id+'" onclick="tap(\''+s.id+'\')">'+(s.sh?'⭐ ':'')+s.id+'</div>';
        total++;
      }
      if(!chips)continue;
      ghtml+='<div class="miss-team">';
      ghtml+='<div class="miss-team-hdr">';
      if(team.flag)ghtml+='<div class="miss-team-flag">'+team.flag+'</div>';
      ghtml+='<div class="miss-team-name">'+team.name+'</div>';
      ghtml+='</div>';
      ghtml+='<div class="chips">'+chips+'</div>';
      ghtml+='</div>';
    }
    if(ghtml){
      html+='<div style="font-size:11px;font-weight:800;color:var(--muted);letter-spacing:2px;text-transform:uppercase;padding:14px 2px 6px;border-bottom:1px solid var(--border);margin-bottom:10px;">'+g.label+'</div>';
      html+=ghtml;
    }
  }

  if(!html){
    if(showOwned&&!srchQ) html='<div class="empty"><div class="ei">📦</div><div class="et">Todavía no marcaste ninguna</div><div class="es">Tocá una figurita en el Álbum para marcarla</div></div>';
    else if(!showOwned&&!srchQ) html='<div class="empty"><div class="ei">🏆</div><div class="et">¡Álbum completo!</div><div class="es">¡Felicitaciones!</div></div>';
    else html='<div class="no-results">Sin resultados para "'+srchQ+'"</div>';
  }
  return html;
}

// ============================================================
// TOAST
// ============================================================
function showToast(msg,type) {
  var el=document.getElementById('toast');
  el.textContent=msg;
  el.className='toast show '+(type||'g');
  clearTimeout(toastTmr);
  toastTmr=setTimeout(function(){el.className='toast';},1300);
}

// ============================================================
// INIT
// ============================================================
load();
updCounters();
render();
</script>
</body>
</html>
