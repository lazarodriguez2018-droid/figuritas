<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Figuritas 2026">
<meta name="theme-color" content="#0a1628">
<title>🏆 Figuritas Mundial 2026</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500&display=swap');

  :root {
    --bg: #0a1628;
    --surface: #111f3a;
    --card: #162340;
    --border: #1e3157;
    --gold: #f5c518;
    --gold2: #e8a000;
    --green: #2ecc71;
    --red: #e74c3c;
    --blue: #3498db;
    --text: #e8edf5;
    --muted: #6b84a8;
    --accent: #4fc3f7;
    --radius: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Barlow', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    min-height: -webkit-fill-available;
    overflow-x: hidden;
  }

  /* ── HEADER ── */
  .app-header {
    background: linear-gradient(135deg, #0a1628 0%, #1a2f5a 50%, #0a1628 100%);
    border-bottom: 2px solid var(--gold);
    padding: 14px 16px 12px;
    position: sticky;
    top: 0;
    z-index: 100;
    padding-top: max(14px, env(safe-area-inset-top));
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .app-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: 2px;
    color: var(--gold);
    line-height: 1;
    text-shadow: 0 0 20px rgba(245,197,24,0.4);
  }
  .app-title span { color: #fff; font-size: 14px; display: block; font-family: 'Barlow Condensed', sans-serif; letter-spacing: 3px; font-weight: 600; }

  .progress-pill {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 6px 14px;
    text-align: center;
    min-width: 80px;
  }
  .progress-pill .num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    color: var(--gold);
    line-height: 1;
  }
  .progress-pill .lbl { font-size: 10px; color: var(--muted); font-family: 'Barlow Condensed', sans-serif; letter-spacing: 1px; }

  .progress-bar-wrap {
    margin-top: 10px;
    background: var(--surface);
    border-radius: 4px;
    height: 6px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--gold2), var(--gold));
    border-radius: 4px;
    transition: width 0.4s ease;
  }

  /* ── SEARCH ── */
  .search-bar {
    padding: 10px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .search-input {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    font-size: 14px;
    outline: none;
  }
  .search-input::placeholder { color: var(--muted); }
  .search-input:focus { border-color: var(--accent); }

  .filter-btn {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    color: var(--muted);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
  }
  .filter-btn.active { background: var(--gold2); color: #000; border-color: var(--gold); }

  /* ── TABS / NAV ── */
  .nav-tabs {
    display: flex;
    overflow-x: auto;
    gap: 0;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    scrollbar-width: none;
  }
  .nav-tabs::-webkit-scrollbar { display: none; }
  .nav-tab {
    padding: 10px 18px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--muted);
    white-space: nowrap;
    cursor: pointer;
    border-bottom: 3px solid transparent;
    transition: all 0.2s;
  }
  .nav-tab.active { color: var(--gold); border-bottom-color: var(--gold); }

  /* ── MAIN CONTENT ── */
  .content { padding: 12px 12px 100px; }

  /* ── SECTION ── */
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 4px 8px;
    cursor: pointer;
    user-select: none;
  }
  .section-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    letter-spacing: 2px;
    color: var(--accent);
  }
  .section-meta {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-count {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    background: var(--surface);
    padding: 3px 8px;
    border-radius: 10px;
    border: 1px solid var(--border);
  }
  .section-count.done { color: var(--green); border-color: var(--green); }
  .collapse-icon { color: var(--muted); font-size: 16px; transition: transform 0.2s; }
  .collapsed .collapse-icon { transform: rotate(-90deg); }

  /* ── TEAM CARD ── */
  .team-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 10px;
    overflow: hidden;
  }
  .team-header {
    display: flex;
    align-items: center;
    padding: 10px 14px;
    cursor: pointer;
    gap: 10px;
    user-select: none;
  }
  .team-flag { font-size: 24px; width: 32px; text-align: center; flex-shrink: 0; }
  .team-info { flex: 1; min-width: 0; }
  .team-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--text);
  }
  .team-code { font-size: 11px; color: var(--muted); letter-spacing: 1px; }
  .team-progress {
    text-align: right;
    flex-shrink: 0;
  }
  .team-progress-num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    line-height: 1;
    color: var(--gold);
  }
  .team-progress-bar {
    width: 60px;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin-top: 3px;
    overflow: hidden;
  }
  .team-progress-bar-fill {
    height: 100%;
    background: var(--gold);
    border-radius: 2px;
    transition: width 0.3s;
  }
  .team-progress-bar-fill.full { background: var(--green); }

  /* ── STICKERS GRID ── */
  .stickers-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    padding: 0 12px 12px;
  }

  .sticker-btn {
    aspect-ratio: 1;
    border-radius: 8px;
    border: 2px solid var(--border);
    background: var(--surface);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.15s;
    -webkit-user-select: none;
    padding: 2px;
  }
  .sticker-btn .code {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    line-height: 1;
  }
  .sticker-btn .icon { font-size: 18px; line-height: 1; margin-bottom: 1px; }
  .sticker-btn .label {
    font-size: 8px;
    color: var(--muted);
    text-align: center;
    line-height: 1.1;
    max-width: 100%;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }

  .sticker-btn.owned {
    background: rgba(46,204,113,0.12);
    border-color: var(--green);
  }
  .sticker-btn.owned .code { color: var(--green); }
  .sticker-btn.owned .icon { filter: none; }

  .sticker-btn.shiny {
    background: linear-gradient(135deg, rgba(245,197,24,0.12), rgba(232,160,0,0.08));
    border-color: var(--gold);
  }
  .sticker-btn.shiny.owned {
    background: linear-gradient(135deg, rgba(245,197,24,0.25), rgba(232,160,0,0.15));
  }
  .sticker-btn.shiny.owned .code { color: var(--gold); }

  .sticker-btn:active { transform: scale(0.92); }

  /* ── SPECIAL SECTIONS ── */
  .special-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    margin-bottom: 10px;
  }

  /* ── STATS VIEW ── */
  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 16px;
  }
  .stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    text-align: center;
  }
  .stat-num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 42px;
    line-height: 1;
    color: var(--gold);
  }
  .stat-num.green { color: var(--green); }
  .stat-num.red { color: var(--red); }
  .stat-lbl {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 1px;
    margin-top: 4px;
  }

  .ranking-list { display: flex; flex-direction: column; gap: 6px; }
  .ranking-item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .ranking-pos {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    color: var(--muted);
    width: 24px;
    text-align: center;
    flex-shrink: 0;
  }
  .ranking-pos.gold { color: var(--gold); }
  .ranking-flag { font-size: 20px; flex-shrink: 0; }
  .ranking-name {
    flex: 1;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 15px;
    font-weight: 700;
  }
  .ranking-bar-wrap { width: 80px; position: relative; }
  .ranking-bar {
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }
  .ranking-bar-fill { height: 100%; background: var(--gold); border-radius: 3px; }
  .ranking-pct {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 14px;
    color: var(--gold);
    text-align: right;
  }

  /* ── BOTTOM NAV ── */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
    z-index: 100;
  }
  .bottom-nav-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px 4px 6px;
    cursor: pointer;
    color: var(--muted);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.5px;
    transition: color 0.2s;
    gap: 2px;
  }
  .bottom-nav-btn .nav-icon { font-size: 22px; line-height: 1; }
  .bottom-nav-btn.active { color: var(--gold); }

  /* ── TOAST ── */
  .toast {
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 10px 20px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 15px;
    font-weight: 600;
    z-index: 200;
    opacity: 0;
    transition: all 0.3s;
    white-space: nowrap;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.green { border-color: var(--green); color: var(--green); }
  .toast.red { border-color: var(--red); color: var(--red); }

  /* ── RESET BTN ── */
  .danger-btn {
    background: transparent;
    border: 1px solid var(--red);
    color: var(--red);
    border-radius: 8px;
    padding: 10px 16px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    width: 100%;
    margin-top: 12px;
  }

  .section-wrapper.collapsed .stickers-grid,
  .section-wrapper.collapsed .team-card,
  .section-wrapper.collapsed .special-grid { display: none; }

  .hidden { display: none !important; }

  /* ── MISSING VIEW ── */
  .missing-chip {
    display: inline-block;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 8px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: var(--red);
    margin: 3px;
  }
  .missing-chip.shiny { color: var(--gold); border-color: var(--gold); }

  .section-lbl {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin: 16px 0 6px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }

  .tip {
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    padding: 20px;
    line-height: 1.5;
  }

  /* Install banner */
  .install-banner {
    background: linear-gradient(135deg, #1a3a6b, #0d2044);
    border: 1px solid var(--gold);
    border-radius: var(--radius);
    padding: 12px 16px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .install-banner .ib-icon { font-size: 28px; flex-shrink: 0; }
  .install-banner .ib-text { flex: 1; font-size: 13px; line-height: 1.4; color: var(--text); }
  .install-banner .ib-text strong { color: var(--gold); }
  .install-banner .ib-close { color: var(--muted); font-size: 20px; cursor: pointer; flex-shrink: 0; }
</style>
</head>

      {code:'IRQ', name:'Irak', flag:'🇮🇶'},
      {code:'NOR', name:'Noruega', flag:'🇳🇴'},
    ]
  },
  {
    id:'J', label:'Grupo J',
    teams:[
      {code:'ARG', name:'Argentina', flag:'🇦🇷'},
      {code:'ALG', name:'Argelia', flag:'🇩🇿'},
      {code:'AUT', name:'Austria', flag:'🇦🇹'},
      {code:'JOR', name:'Jordania', flag:'🇯🇴'},
    ]
  },
  {
    id:'K', label:'Grupo K',
    teams:[
      {code:'POR', name:'Portugal', flag:'🇵🇹'},
      {code:'COD', name:'RD Congo', flag:'🇨🇩'},
      {code:'UZB', name:'Uzbekistán', flag:'🇺🇿'},
      {code:'COL', name:'Colombia', flag:'🇨🇴'},
    ]
  },
  {
    id:'L', label:'Grupo L',
    teams:[
      {code:'ENG', name:'Inglaterra', flag:'🏴󠁧󠁢󠁥󠁮󠁧󠁿'},
      {code:'CRO', name:'Croacia', flag:'🇭🇷'},
      {code:'GHA', name:'Ghana', flag:'🇬🇭'},
      {code:'PAN', name:'Panamá', flag:'🇵🇦'},
    ]
  },
];

// ══════════════════════════════════════
//  STATE
// ══════════════════════════════════════
const STORAGE_KEY = 'figuritas_mundial_2026_v1';
let owned = {}; // {stickerId: true}
let filterMissing = false;
let currentPage = 'album';
let currentGroupTab = 'INICIAL';
let searchQuery = '';

function loadData() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) owned = JSON.parse(saved);
  } catch(e) { owned = {}; }
}
function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(owned));
}
function toggleSticker(id, shiny=false) {
  if (owned[id]) {
    delete owned[id];
    showToast(`❌ ${id} quitada`, 'red');
  } else {
    owned[id] = true;
    showToast(`✅ ${id} marcada`, 'green');
  }
  saveData();
  renderAll();
}

// ══════════════════════════════════════
//  TOTALS
// ══════════════════════════════════════
function getAllStickers() {
  const all = [];
  SPECIAL_INITIAL.forEach(s => all.push(s.id));
  STADIUMS.forEach(s => all.push(s.id));
  GROUPS.forEach(g => g.teams.forEach(t => {
    for(let i=1;i<=20;i++) all.push(t.code+i);
  }));
  COCA_COLA.forEach(s => all.push(s.id));
  return all;
}
function getTotals() {
  const all = getAllStickers();
  const total = all.length;
  const have = all.filter(id => owned[id]).length;
  return {total, have, missing: total - have};
}

// ══════════════════════════════════════
//  TEAM STICKERS BUILDER
// ══════════════════════════════════════
function buildTeamStickers(team) {
  const stickers = [];
  // 1: escudo brillante
  stickers.push({id:`${team.code}1`, label:'Escudo', icon:'🛡️', shiny:true});
  // 2: foto equipo
  stickers.push({id:`${team.code}2`, label:'Foto Equipo', icon:'📸'});
  // 3-20: jugadores
  for(let i=3;i<=20;i++) {
    stickers.push({id:`${team.code}${i}`, label:`Jugador ${i-2}`, icon:'⚽'});
  }
  return stickers;
}

// ══════════════════════════════════════
//  RENDER HELPERS
// ══════════════════════════════════════
function stickerEl(s, size='normal') {
  const isOwned = owned[s.id];
  const cls = ['sticker-btn', s.shiny?'shiny':'', isOwned?'owned':''].filter(Boolean).join(' ');
  // filter if needed
  if (filterMissing && isOwned) return '';
  if (searchQuery && !s.id.toLowerCase().includes(searchQuery) && !s.label.toLowerCase().includes(searchQuery)) return '';
  return `<div class="${cls}" onclick="toggleSticker('${s.id}', ${!!s.shiny})" title="${s.id}: ${s.label}">
    <div class="icon">${s.shiny && isOwned ? '✨' : s.icon}</div>
    <div class="code">${s.id}</div>
  </div>`;
}

function teamProgress(team) {
  const stickers = buildTeamStickers(team);
  const have = stickers.filter(s => owned[s.id]).length;
  return {have, total:20, pct: Math.round(have/20*100)};
}

// ══════════════════════════════════════
//  GROUP TABS
// ══════════════════════════════════════
function renderGroupTabs() {
  const tabs = document.getElementById('group-tabs');
  const groupIds = ['INICIAL', 'ESTADIOS', ...GROUPS.map(g=>g.id), 'COCA-COLA'];
  tabs.innerHTML = groupIds.map(id => {
    const active = id === currentGroupTab ? 'active' : '';
    return `<div class="nav-tab ${active}" onclick="selectGroup('${id}')">${id}</div>`;
  }).join('');
}
function selectGroup(id) {
  currentGroupTab = id;
  renderGroupTabs();
  renderAlbum();
}

// ══════════════════════════════════════
//  RENDER ALBUM
// ══════════════════════════════════════
function renderAlbum() {
  const container = document.getElementById('album-content');
  let html = '';

  if (currentGroupTab === 'INICIAL') {
    html += renderSpecialSection('Sección Inicial', SPECIAL_INITIAL);
  } else if (currentGroupTab === 'ESTADIOS') {
    html += renderSpecialSection('Estadios y Sedes', STADIUMS);
  } else if (currentGroupTab === 'COCA-COLA') {
    html += renderSpecialSection('Team Coca-Cola ⭐', COCA_COLA);
  } else {
    const group = GROUPS.find(g => g.id === currentGroupTab);
    if (group) {
      group.teams.forEach(team => {
        html += renderTeamCard(team);
      });
    }
  }

  if (!html.trim()) {
    html = '<p class="tip">Sin resultados para los filtros aplicados.</p>';
  }

  container.innerHTML = html;
}

function renderSpecialSection(title, stickers) {
  const items = stickers.map(s => stickerEl(s)).filter(Boolean);
  if (!items.length) return '';
  const have = stickers.filter(s => owned[s.id]).length;
  return `
    <div class="section-lbl">${title} — ${have}/${stickers.length}</div>
    <div class="special-grid">${items.join('')}</div>
  `;
}

function renderTeamCard(team) {
  const stickers = buildTeamStickers(team);
  const prog = teamProgress(team);
  const items = stickers.map(s => stickerEl(s)).filter(Boolean);
  if (filterMissing && !items.length) return '';
  if (searchQuery) {
    const teamMatch = team.name.toLowerCase().includes(searchQuery) || team.code.toLowerCase().includes(searchQuery);
    if (!teamMatch && !items.length) return '';
  }

  const barCls = prog.pct === 100 ? 'full' : '';
  return `
  <div class="team-card">
    <div class="team-header" onclick="toggleTeamCard('tc-${team.code}')">
      <div class="team-flag">${team.flag}</div>
      <div class="team-info">
        <div class="team-name">${team.name}</div>
        <div class="team-code">${team.code}</div>
      </div>
      <div class="team-progress">
        <div class="team-progress-num">${prog.have}/${prog.total}</div>
        <div class="team-progress-bar"><div class="team-progress-bar-fill ${barCls}" style="width:${prog.pct}%"></div></div>
      </div>
    </div>
    <div class="stickers-grid" id="tc-${team.code}">
      ${items.join('')}
    </div>
  </div>`;
}

function toggleTeamCard(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.style.display = el.style.display === 'none' ? 'grid' : 'none';
}

// ══════════════════════════════════════
//  RENDER MISSING
// ══════════════════════════════════════
function renderMissing() {
  const container = document.getElementById('missing-content');
  let html = '';

  // Iniciales
  const missingInitial = SPECIAL_INITIAL.filter(s => !owned[s.id]);
  const missingStadiums = STADIUMS.filter(s => !owned[s.id]);
  const missingCC = COCA_COLA.filter(s => !owned[s.id]);

  if (missingInitial.length) {
    html += `<div class="section-lbl">Sección Inicial — faltan ${missingInitial.length}</div><div>`;
    missingInitial.forEach(s => { html += `<span class="missing-chip ${s.shiny?'shiny':''}" onclick="toggleSticker('${s.id}')">${s.id}</span>`; });
    html += '</div>';
  }
  if (missingStadiums.length) {
    html += `<div class="section-lbl">Estadios — faltan ${missingStadiums.length}</div><div>`;
    missingStadiums.forEach(s => { html += `<span class="missing-chip" onclick="toggleSticker('${s.id}')">${s.id}</span>`; });
    html += '</div>';
  }

  // Teams
  GROUPS.forEach(g => {
    let groupHtml = '';
    g.teams.forEach(team => {
      const stickers = buildTeamStickers(team);
      const missing = stickers.filter(s => !owned[s.id]);
      if (missing.length) {
        groupHtml += `<div style="margin-bottom:6px;"><span style="font-family:'Barlow Condensed';font-weight:700;color:var(--text);font-size:13px;">${team.flag} ${team.name}</span><br>`;
        missing.forEach(s => { groupHtml += `<span class="missing-chip ${s.shiny?'shiny':''}" onclick="toggleSticker('${s.id}')">${s.id}</span>`; });
        groupHtml += '</div>';
      }
    });
    if (groupHtml) {
      const totalMissing = g.teams.reduce((acc,t)=>acc+buildTeamStickers(t).filter(s=>!owned[s.id]).length,0);
      html += `<div class="section-lbl">Grupo ${g.id} — faltan ${totalMissing}</div>${groupHtml}`;
    }
  });

  if (missingCC.length) {
    html += `<div class="section-lbl">Team Coca-Cola — faltan ${missingCC.length}</div><div>`;
    missingCC.forEach(s => { html += `<span class="missing-chip shiny" onclick="toggleSticker('${s.id}')">${s.id}</span>`; });
    html += '</div>';
  }

  const t = getTotals();
  if (t.missing === 0) {
    html = '<div class="tip" style="font-size:48px;margin-top:40px;">🏆<br><br><span style="font-family:\'Bebas Neue\';font-size:28px;color:var(--gold);letter-spacing:3px;">¡ÁLBUM COMPLETO!</span><br><br><span style="font-size:14px;">¡Felicitaciones campeón!</span></div>';
  }

  container.innerHTML = html;
}

// ══════════════════════════════════════
//  RENDER STATS
// ══════════════════════════════════════
function renderStats() {
  const container = document.getElementById('stats-content');
  const t = getTotals();
  const pct = Math.round(t.have/t.total*100);

  // Team rankings
  const teamData = [];
  GROUPS.forEach(g => g.teams.forEach(team => {
    const stickers = buildTeamStickers(team);
    const have = stickers.filter(s => owned[s.id]).length;
    teamData.push({...team, have, total:20, pct: Math.round(have/20*100)});
  }));
  teamData.sort((a,b) => b.pct - a.pct);
  const top5 = teamData.slice(0,5);
  const worst5 = [...teamData].sort((a,b)=>a.pct-b.pct).slice(0,5);

  let rankHtml = '<div class="ranking-list">';
  top5.forEach((t,i) => {
    rankHtml += `<div class="ranking-item">
      <div class="ranking-pos ${i===0?'gold':#''}">${i+1}</div>
      <div class="ranking-flag">${t.flag}</div>
      <div class="ranking-name">${t.name}</div>
      <div class="ranking-bar-wrap">
        <div class="ranking-bar"><div class="ranking-bar-fill" style="width:${t.pct}%"></div></div>
        <div class="ranking-pct">${t.pct}%</div>
      </div>
    </div>`;
  });
  rankHtml += '</div>';

  let worstHtml = '<div class="ranking-list">';
  worst5.forEach((t,i) => {
    worstHtml += `<div class="ranking-item">
      <div class="ranking-pos">${i+1}</div>
      <div class="ranking-flag">${t.flag}</div>
      <div class="ranking-name">${t.name}</div>
      <div class="ranking-bar-wrap">
        <div class="ranking-bar"><div class="ranking-bar-fill" style="width:${t.pct}%;background:var(--red)"></div></div>
        <div class="ranking-pct" style="color:var(--red)">${t.pct}%</div>
      </div>
    </div>`;
  });
  worstHtml += '</div>';

  // Special progress
  const haveInitial = SPECIAL_INITIAL.filter(s=>owned[s.id]).length;
  const haveStadiums = STADIUMS.filter(s=>owned[s.id]).length;
  const haveCC = COCA_COLA.filter(s=>owned[s.id]).length;
  const haveTeams = GROUPS.reduce((acc,g)=>acc+g.teams.reduce((a,t)=>a+buildTeamStickers(t).filter(s=>owned[s.id]).length,0),0);

  container.innerHTML = `
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-num">${t.have}</div><div class="stat-lbl">TENGO</div></div>
      <div class="stat-card"><div class="stat-num red">${t.missing}</div><div class="stat-lbl">FALTAN</div></div>
      <div class="stat-card"><div class="stat-num">${t.total}</div><div class="stat-lbl">TOTAL</div></div>
      <div class="stat-card"><div class="stat-num ${pct===100?'green':''}">${pct}%</div><div class="stat-lbl">PROGRESO</div></div>
    </div>

    <div class="section-lbl">Por sección</div>
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-num" style="font-size:28px;">${haveInitial}/${SPECIAL_INITIAL.length}</div><div class="stat-lbl">INICIALES</div></div>
      <div class="stat-card"><div class="stat-num" style="font-size:28px;">${haveStadiums}/${STADIUMS.length}</div><div class="stat-lbl">ESTADIOS</div></div>
      <div class="stat-card"><div class="stat-num" style="font-size:28px;">${haveTeams}/${GROUPS.reduce((a,g)=>a+g.teams.length*20,0)}</div><div class="stat-lbl">EQUIPOS</div></div>
      <div class="stat-card"><div class="stat-num" style="font-size:28px;">${haveCC}/${COCA_COLA.length}</div><div class="stat-lbl">COCA-COLA</div></div>
    </div>

    <div class="section-lbl">🥇 Equipos más completos</div>
    ${rankHtml}

    <div class="section-lbl" style="margin-top:16px;">📋 Equipos con más pendientes</div>
    ${worstHtml}

    <button class="danger-btn" onclick="confirmReset()">🗑️ Reiniciar todo el álbum</button>
    <p class="tip">Los datos se guardan automáticamente en tu dispositivo. No se necesita internet.</p>
  `;
}

// ══════════════════════════════════════
//  HEADER & BAR
// ══════════════════════════════════════
function updateHeader() {
  const t = getTotals();
  document.getElementById('hdr-owned').textContent = t.have;
  document.getElementById('hdr-missing').textContent = t.missing;
  document.getElementById('main-progress-bar').style.width = `${Math.round(t.have/t.total*100)}%`;
}

// ══════════════════════════════════════
//  FILTER / SEARCH
// ══════════════════════════════════════
function toggleMissingFilter() {
  filterMissing = !filterMissing;
  document.getElementById('filter-missing-btn').classList.toggle('active', filterMissing);
  renderAlbum();
}
function filterAlbum() {
  searchQuery = document.getElementById('search-input').value.toLowerCase().trim();
  renderAlbum();
}

// ══════════════════════════════════════
//  PAGE NAVIGATION
// ══════════════════════════════════════
function switchPage(page) {
  currentPage = page;
  ['album','missing','stats'].forEach(p => {
    document.getElementById(`page-${p}`).classList.toggle('hidden', p !== page);
    document.getElementById(`nav-${p}`).classList.toggle('active', p === page);
  });
  if (page === 'missing') renderMissing();
  if (page === 'stats') renderStats();
}

// ══════════════════════════════════════
//  TOAST
// ══════════════════════════════════════
let toastTimer;
function showToast(msg, type='green') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `toast show ${type}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.classList.remove('show'); }, 1400);
}

// ══════════════════════════════════════
//  RESET
// ══════════════════════════════════════
function confirmReset() {
  if (confirm('⚠️ ¿Reiniciar todo el álbum?\nSe perderán todas las figuritas marcadas.')) {
    owned = {};
    saveData();
    renderAll();
    showToast('Álbum reiniciado', 'red');
  }
}

// ══════════════════════════════════════
//  RENDER ALL
// ══════════════════════════════════════
function renderAll() {
  updateHeader();
  renderGroupTabs();
  renderAlbum();
  if (currentPage === 'missing') renderMissing();
  if (currentPage === 'stats') renderStats();
}

// ══════════════════════════════════════
//  INIT
// ══════════════════════════════════════
loadData();
renderAll();

// Service Worker para offline
if ('serviceWorker' in navigator) {
  // Registrar SW inline
  const swCode = `
self.addEventListener('install', e => self.skipWaiting());
self.addEventListener('activate', e => e.waitUntil(clients.claim()));
self.addEventListener('fetch', e => {
  if (e.request.url.includes('fonts.googleapis') || e.request.url.includes('fonts.gstatic')) {
    e.respondWith(fetch(e.request).catch(() => new Response('')));
  }
});
`;
  const blob = new Blob([swCode], {type:'application/javascript'});
  const swUrl = URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl).catch(()=>{});
}
</script>
